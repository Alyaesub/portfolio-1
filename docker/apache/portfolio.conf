<VirtualHost *:80>
    ServerName localhost

    DocumentRoot /var/www/html
    DirectoryIndex index.php

    <Directory /var/www/html>
        Options -Indexes -MultiViews
        AllowOverride None
        Require all granted
    </Directory>

    RewriteEngine On

    # Gestion des routes du portfolio
    RewriteRule "^/(accueil|a-propos|competences|experiences|projets|contact|diplomes|blog)/?$" "/index.php" [END]

    # Protection des fichiers internes
    <LocationMatch "^/(vendor|controllers|docker|\.git)(/|$)">
        Require all denied
    </LocationMatch>

    <FilesMatch "^(\.env.*|composer\.(json|lock)|Dockerfile|compose\.ya?ml|README.*|\.dockerignore|\.gitignore)$">
        Require all denied
    </FilesMatch>

    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
