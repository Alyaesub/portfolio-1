
services:
  portfolio:
    image: ghcr.io/alyaesub/portfolio:latest

    container_name: portfolio

    restart: unless-stopped

    ports:
      - "127.0.0.1:8081:80"

    environment:
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}

    security_opt:
      - no-new-privileges:true
